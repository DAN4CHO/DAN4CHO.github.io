<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>PERMM (превью) · 3D-просмотр</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--panel:rgba(18,20,24,.74);--panel-hi:rgba(255,255,255,.08);--line:rgba(255,255,255,.12);--text:#f3f4f6;--muted:#a3a8b3;--accent:#ffb547}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
    background:linear-gradient(180deg,#b9c6d6 0%,#dfe5ec 55%,#eef0f2 100%)}
  #app{position:fixed;inset:0;touch-action:none}
  #app canvas{display:block;outline:none}
  .panel{background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  #head{position:fixed;top:14px;left:14px;padding:10px 14px;display:flex;align-items:center;gap:10px;max-width:calc(100% - 120px)}
  #head .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent);flex:none}
  #head b{font-weight:700;letter-spacing:.02em}
  #head span{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #tools{position:fixed;top:14px;right:14px;display:flex;gap:8px}
  .icon{width:42px;height:42px;display:grid;place-items:center;border-radius:12px}
  .icon:hover{background:var(--panel-hi)}
  .icon svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  #bottom{position:fixed;left:0;right:0;bottom:14px;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
  #bottom > *{pointer-events:auto}
  #levels{display:flex;align-items:center;gap:4px;padding:5px}
  .seg{padding:8px 14px;border-radius:10px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
  .seg:hover{color:var(--text)}
  .seg.on{color:var(--accent)}
  #joy{position:fixed;left:22px;bottom:96px;width:124px;height:124px;border-radius:50%;display:none;touch-action:none;z-index:5}
  #joy i{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(255,255,255,.25);border:1px solid var(--line);pointer-events:none}
  body.walk.touch #joy{display:block}
  #vert{position:fixed;right:22px;bottom:96px;display:none;flex-direction:column;gap:12px;z-index:5}
  body.walk.touch #vert{display:flex}
  #vert button{width:58px;height:58px;border-radius:50%;font-size:20px;color:var(--text);touch-action:none;-webkit-user-select:none;user-select:none}
  #vert button.on{background:rgba(255,181,71,.35)}
  #cut{display:flex;align-items:center;gap:10px;padding:0 10px 0 12px;border-left:1px solid var(--line);margin-left:4px;height:34px}
  #cut label{font-size:13px;color:var(--muted);white-space:nowrap}
  #cut output{font-size:13px;min-width:62px;font-variant-numeric:tabular-nums}
  input[type=range]{-webkit-appearance:none;appearance:none;width:140px;height:4px;border-radius:4px;background:rgba(255,255,255,.18);outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);border:0}
  input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--accent);border:0}
  #help{position:fixed;top:64px;right:14px;width:272px;padding:12px 14px;font-size:13px;line-height:1.45;color:#d6d9df;
    max-height:calc(100% - 160px);overflow:auto}
  #help.hide{display:none}
  #help h3{margin:0 0 6px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
  #help h3 + .rows{margin-bottom:12px}
  #help .rows div{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
  #help .rows div span:first-child{color:var(--text);font-weight:600;white-space:nowrap}
  #help .rows div span:last-child{text-align:right;color:var(--muted)}
  #help .btns div{padding:3px 0}
  #help .btns b{color:var(--text);font-weight:600}
  #help .btns span{color:var(--muted)}
  #helpBtn.on{color:var(--accent)}
  #loader{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(180deg,#14161a,#1d2026);z-index:10;transition:opacity .7s}
  #loader.done{opacity:0;pointer-events:none}
  #loader .box{width:min(360px,80vw);text-align:center}
  #loader h1{font-size:20px;font-weight:700;margin:0 0 4px}
  #loader p{color:var(--muted);font-size:14px;margin:0 0 22px}
  .bar{height:6px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  #lstat{margin-top:12px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  #lerr{margin-top:16px;font-size:13px;color:#ff8b7b;display:none;line-height:1.5}
  @media (max-width:380px){
    input[type=range]{width:62px}
    #cut{gap:6px;padding:0 6px 0 8px}
    #cut output{min-width:40px}
  }
  @media (max-width:640px){
    #head span{display:none}
    #cut label{display:none}
    input[type=range]{width:90px}
    .seg{padding:8px 10px}
    #help{width:min(230px,calc(100% - 28px));font-size:12px;padding:10px 12px}
  }
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="app"></div>
<div id="head" class="panel"><i class="dot"></i><b>PERMM (превью)</b><span>3D-модель</span></div>
<div id="tools">
  <button class="icon panel" id="helpBtn" title="Управление" aria-label="Управление">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.3a2.6 2.6 0 0 1 5 .9c0 1.7-2.5 2.3-2.5 3.8"/><path d="M12 17.2h.01"/></svg>
  </button>
  <button class="icon panel" id="fsBtn" title="Во весь экран" aria-label="Во весь экран">
    <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </button>
</div>
<div id="help" class="panel"></div>
<div id="bottom">
  <div id="levels" class="panel">
    <button class="seg" id="resetBtn">Общий вид</button>
    <button class="seg" id="walkBtn" title="Вид от первого лица">Прогулка</button>
    <div id="cut"><label for="cutRange">Срез по высоте</label><input id="cutRange" type="range" min="0" max="10" step="0.05" value="10"><output id="cutOut">нет</output></div>
  </div>
</div>
<div id="joy" class="panel"><i></i></div>
<div id="vert"><button class="panel" id="upBtn" aria-label="Выше">▲</button><button class="panel" id="downBtn" aria-label="Ниже">▼</button></div>
<div id="loader">
  <div class="box">
    <h1>PERMM (превью)</h1>
    <p>Загружаем 3D-модель</p>
    <div class="bar"><i id="lbar"></i></div>
    <div id="lstat">Подключение…</div>
    <div id="lerr"></div>
  </div>
</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const PARTS = [["../permm/model-0.txt", 14000000, 10500000], ["../permm/model-1.txt", 14000000, 10500000], ["../permm/model-2.txt", 14000000, 10500000], ["../permm/model-3.txt", 14000000, 10500000], ["../permm/model-4.txt", 8907836, 6680876]];
let NO_CUT = 1e4;            // set from the model's height after load

const app = document.getElementById('app');
const IS_MOBILE = matchMedia('(pointer: coarse)').matches || /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
const MAX_TEX = IS_MOBILE ? 512 : 2048;
const renderer = new THREE.WebGLRenderer({ antialias: !IS_MOBILE, alpha:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, IS_MOBILE ? 1.25 : 1.75));
renderer.domElement.addEventListener('webglcontextlost', e => {
  e.preventDefault();
  document.getElementById('loader').classList.remove('done');
  lerr.style.display = 'block';
  lerr.textContent = 'Устройству не хватило видеопамяти для этой модели. Попробуйте открыть на компьютере.';
});
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.75;
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8f99, 0.9));
const sun = new THREE.DirectionalLight(0xfff4e5, 1.6);
sun.position.set(40, 80, 30);
scene.add(sun);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 2000);
camera.position.set(30, 20, 30);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.screenSpacePanning = true;
controls.zoomToCursor = true;
controls.minDistance = 0.5;
controls.maxDistance = 400;
controls.maxPolarAngle = Math.PI * 0.92;
controls.update();

const clipPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), 1e5);
renderer.clippingPlanes = [clipPlane];
let cutH = NO_CUT;
let dirty = true;
const requestRender = () => { dirty = true; };
controls.addEventListener('change', requestRender);
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); requestRender();
});

const cutRange = document.getElementById('cutRange');
const cutOut = document.getElementById('cutOut');
let groundY = 0;
function setCut(h, fromSlider = false) {
  cutH = h;
  const none = h >= NO_CUT - 0.01;
  clipPlane.constant = none ? 1e5 : h;
  cutOut.textContent = none ? 'нет' : (h - groundY).toFixed(1).replace('.', ',') + ' м';
  if (!fromSlider) cutRange.value = h;
  requestRender();
}
cutRange.addEventListener('input', () => { flight = null; setCut(parseFloat(cutRange.value), true); });

let flight = null;
const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
function flyTo(pos, tgt, cut, dur = 1200) {
  flight = { t0: performance.now(), dur,
    p0: camera.position.clone(), p1: new THREE.Vector3(...pos),
    q0: controls.target.clone(), q1: new THREE.Vector3(...tgt),
    c0: cutH, c1: cut ?? cutH };
}
let home = null;
document.getElementById('resetBtn').addEventListener('click', () => { if (walk) exitWalk(false); if (home) flyTo(home.pos, home.tgt, NO_CUT); });
controls.addEventListener('start', () => { if (flight) flight = null; });

const ray = new THREE.Raycaster();
let model = null;
const DOWN = new THREE.Vector3(0, -1, 0);
const cutLimit = () => (cutH >= NO_CUT - 0.01 ? 1e5 : cutH) + 1e-3;
function castFirst(origin, dir, far = Infinity) {
  ray.set(origin, dir); ray.far = far;
  const hits = ray.intersectObject(model, true);
  ray.far = Infinity;
  return hits.find(h => h.point.y <= cutLimit()) || null;
}
function screenHit(clientX, clientY) {
  const r = renderer.domElement.getBoundingClientRect();
  const ndc = new THREE.Vector2(((clientX - r.left) / r.width) * 2 - 1, -((clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  return ray.intersectObject(model, true).find(h => h.point.y <= cutLimit()) || null;
}
function pickAndFly(clientX, clientY) {
  if (!model) return;
  if (walk) { walkTo(clientX, clientY); return; }
  const hit = screenHit(clientX, clientY);
  if (!hit) return;
  const dir = camera.position.clone().sub(controls.target).normalize();
  const dist = Math.min(camera.position.distanceTo(hit.point), 9);
  const pos = hit.point.clone().addScaledVector(dir, Math.max(dist * 0.55, 2.5));
  flyTo(pos.toArray(), hit.point.toArray(), cutH, 900);
}

// ---------- first-person walk ----------
const EYE = 1.65;
let walk = null, walkFly = null, lastNow = performance.now();
const keys = new Set();
const joy = { x: 0, y: 0, id: null };
const walkBtn = document.getElementById('walkBtn');
if (IS_MOBILE) document.body.classList.add('touch');
const fwdOf = (yaw, pitch) => new THREE.Vector3(Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), Math.cos(yaw) * Math.cos(pitch));
function aim() { camera.lookAt(camera.position.clone().add(fwdOf(walk.yaw, walk.pitch))); }
function standPoint(hit, from) {          // floor point to stand on for a clicked surface
  const p = hit.point.clone();
  const down = castFirst(p.clone().add(new THREE.Vector3(0, 0.05, 0)), DOWN, 0.25);
  if (down) return down.point;                                   // clicked a floor-like surface
  const back = from.clone().sub(p); back.y = 0;                  // clicked a wall: step back and drop
  if (back.lengthSq() < 1e-6) back.set(0, 0, 1);
  const q = p.clone().add(back.normalize().multiplyScalar(1.2)); q.y += 0.05;
  const f = castFirst(q, DOWN);
  return f ? f.point : new THREE.Vector3(q.x, groundY, q.z);
}
const UP = new THREE.Vector3(0, 1, 0);
function isStandable(p) {                 // a real floor: flat around the point and no ceiling at head height
  for (const [dx, dz] of [[0, 0], [0.4, 0], [-0.4, 0], [0, 0.4], [0, -0.4]]) {
    const h = castFirst(new THREE.Vector3(p.x + dx, p.y + 0.3, p.z + dz), DOWN, 0.6);
    if (!h || Math.abs(h.point.y - p.y) > 0.25) return false;
  }
  return !castFirst(new THREE.Vector3(p.x, p.y + 0.1, p.z), UP, 1.9);
}
function clearYaw(eye, yaw) {             // turn away from a wall right in front of the eyes
  let best = yaw, bestD = -1;
  for (const off of [0, 0.5, -0.5, 1.05, -1.05, 1.57, -1.57, 2.36, -2.36, 3.14]) {
    const h = castFirst(eye, fwdOf(yaw + off, 0));
    const d = h ? h.distance : 1e9;
    if (d >= 5) return yaw + off;
    if (d > bestD) { bestD = d; best = yaw + off; }
  }
  return best;
}
function startWalkFly(foot, dur = 900, keepPitch = false) {
  walkFly = { t0: performance.now(), dur, p0: camera.position.clone(), p1: foot.clone().add(new THREE.Vector3(0, EYE, 0)),
              pitch0: walk.pitch, pitch1: keepPitch ? walk.pitch : Math.max(-0.35, Math.min(0.1, walk.pitch)) };
}
function enterWalk() {
  if (!model || walk) return;
  flight = null;
  const d = new THREE.Vector3(); camera.getWorldDirection(d);
  walk = { yaw: Math.atan2(d.x, d.z), pitch: Math.asin(THREE.MathUtils.clamp(d.y, -1, 1)) };
  ray.setFromCamera(new THREE.Vector2(0, 0), camera);
  const hits = ray.intersectObject(model, true).filter(h => h.point.y <= cutLimit());
  let foot = null;
  for (const h of hits.slice(0, 16)) if (isStandable(h.point) && (!foot || h.point.y < foot.y - 0.3)) foot = h.point.clone();   // lowest real floor along the view
  if (!foot && hits.length) foot = standPoint(hits[0], camera.position);
  if (!foot) {
    const t = controls.target.clone(); t.y = Math.min(cutLimit() - 0.01, NO_CUT);
    const f = castFirst(t, DOWN); foot = f ? f.point : new THREE.Vector3(controls.target.x, groundY, controls.target.z);
  }
  walk.yaw = clearYaw(foot.clone().add(new THREE.Vector3(0, EYE, 0)), walk.yaw);
  walk.pitch = Math.max(-0.35, walk.pitch);
  controls.enabled = false;
  camera.near = 0.05; camera.updateProjectionMatrix();
  startWalkFly(foot, 1100);
  document.body.classList.add('walk'); walkBtn.classList.add('on'); walkBtn.textContent = 'Обзор';
  showHint(); requestRender();
}
function exitWalk(keepView = true) {
  if (!walk) return;
  const f = fwdOf(walk.yaw, walk.pitch);
  walk = null; walkFly = null; keys.clear(); joy.x = joy.y = 0; vert = 0;
  controls.target.copy(camera.position).addScaledVector(f, 4);
  controls.enabled = true; controls.update();
  document.body.classList.remove('walk'); walkBtn.classList.remove('on'); walkBtn.textContent = 'Прогулка';
  showHint(); requestRender();
}
function walkTo(clientX, clientY) {
  const hit = screenHit(clientX, clientY);
  if (hit) startWalkFly(standPoint(hit, camera.position), 800);
}
walkBtn.addEventListener('click', () => (walk ? exitWalk() : enterWalk()));
window.__viewer = { camera, controls, get walk() { return walk; }, get model() { return model; }, screenHit, castFirst, standPoint, step: dt => stepWalk(dt), snapToFloor: () => snapToFloor(), setVert: d => { vert = d; } };

// look around: drag on the canvas (grab-the-world style)
let look = null;
renderer.domElement.addEventListener('pointerdown', e => {
  if (!walk) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;      // look only while the left button is held
  look = { id: e.pointerId, x: e.clientX, y: e.clientY, touch: e.pointerType !== 'mouse' };
  renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener('pointermove', e => {
  if (!walk || !look || e.pointerId !== look.id) return;
  const dx = e.clientX - look.x, dy = e.clientY - look.y;
  if (look.touch) {           // finger drags the view (Street View style)
    walk.yaw += dx * 0.006; walk.pitch += dy * 0.006;
  } else {                    // mouse with LMB held: game-style, mouse right = look right, up = look up
    walk.yaw -= dx * 0.0045; walk.pitch -= dy * 0.0045;
  }
  walk.pitch = THREE.MathUtils.clamp(walk.pitch, -1.45, 1.45);
  look.x = e.clientX; look.y = e.clientY;
  if (!walkFly) aim();
  requestRender();
});
['pointerup', 'pointercancel'].forEach(ev => renderer.domElement.addEventListener(ev, e => { if (look && e.pointerId === look.id) look = null; }));
renderer.domElement.addEventListener('wheel', e => {
  if (!walk || walkFly) return;
  e.preventDefault();
  const f = fwdOf(walk.yaw, 0);
  camera.position.addScaledVector(f, THREE.MathUtils.clamp(-e.deltaY * 0.004, -1.5, 1.5));
  requestRender();
}, { passive: false });
const MOVE_KEYS = ['KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyQ', 'KeyE', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ShiftLeft', 'ShiftRight'];
addEventListener('keydown', e => {
  if (!walk || !MOVE_KEYS.includes(e.code)) return;
  if (document.activeElement && document.activeElement.tagName === 'INPUT') document.activeElement.blur();
  keys.add(e.code); e.preventDefault();
});
addEventListener('keyup', e => {
  const wasVert = keys.has(e.code) && (e.code === 'KeyQ' || e.code === 'KeyE');
  keys.delete(e.code);
  if (wasVert && walk && !keys.has('KeyQ') && !keys.has('KeyE')) snapToFloor();
});

// up / down (phones: hold the buttons; release lands on the floor below if it is close)
let vert = 0;
function snapToFloor() {
  if (!walk || walkFly) return;
  // start a bit above the eyes so a release inside a floor slab still finds the slab's top
  const h = castFirst(camera.position.clone().add(new THREE.Vector3(0, 0.4, 0)), DOWN, 0.4 + EYE + 2.5);
  if (h && Math.abs(h.point.y + EYE - camera.position.y) > 0.05) startWalkFly(h.point, 350, true);
}
for (const [id, dir] of [['upBtn', 1], ['downBtn', -1]]) {
  const b = document.getElementById(id);
  b.addEventListener('pointerdown', e => { e.preventDefault(); b.setPointerCapture(e.pointerId); vert = dir; b.classList.add('on'); });
  const stop = () => { if (vert === dir) { vert = 0; b.classList.remove('on'); snapToFloor(); } };
  b.addEventListener('pointerup', stop); b.addEventListener('pointercancel', stop);
  b.addEventListener('contextmenu', e => e.preventDefault());
}
addEventListener('blur', () => keys.clear());

// joystick (phones)
const joyEl = document.getElementById('joy'), knob = joyEl.firstElementChild;
function moveJoy(e) {
  const r = joyEl.getBoundingClientRect();
  let dx = (e.clientX - (r.left + r.width / 2)) / (r.width / 2), dy = (e.clientY - (r.top + r.height / 2)) / (r.height / 2);
  const l = Math.hypot(dx, dy); if (l > 1) { dx /= l; dy /= l; }
  joy.x = dx; joy.y = -dy; knob.style.transform = `translate(${dx * 37}px,${dy * 37}px)`;
}
joyEl.addEventListener('pointerdown', e => { e.preventDefault(); joy.id = e.pointerId; joyEl.setPointerCapture(e.pointerId); moveJoy(e); });
joyEl.addEventListener('pointermove', e => { if (e.pointerId === joy.id) moveJoy(e); });
['pointerup', 'pointercancel'].forEach(ev => joyEl.addEventListener(ev, e => {
  if (e.pointerId === joy.id) { joy.id = null; joy.x = joy.y = 0; knob.style.transform = ''; }
}));

function stepWalk(dt) {
  if (walkFly) {
    const k = Math.min(1, (performance.now() - walkFly.t0) / walkFly.dur), e = ease(k);
    camera.position.lerpVectors(walkFly.p0, walkFly.p1, e);
    walk.pitch = walkFly.pitch0 + (walkFly.pitch1 - walkFly.pitch0) * e;
    aim(); if (k >= 1) walkFly = null;
    return true;
  }
  let f = 0, s = 0, u = 0, turn = 0;
  if (keys.has('KeyW') || keys.has('ArrowUp')) f += 1;
  if (keys.has('KeyS') || keys.has('ArrowDown')) f -= 1;
  if (keys.has('KeyD')) s += 1;
  if (keys.has('KeyA')) s -= 1;
  if (keys.has('ArrowLeft')) turn += 1;
  if (keys.has('ArrowRight')) turn -= 1;
  if (keys.has('KeyE')) u += 1;
  if (keys.has('KeyQ')) u -= 1;
  f += joy.y; s += joy.x; u += vert;
  if (!f && !s && !u && !turn) return false;
  const speed = (keys.has('ShiftLeft') || keys.has('ShiftRight')) ? 6 : 2.2;
  walk.yaw += turn * 1.8 * dt;
  const fw = fwdOf(walk.yaw, 0), right = new THREE.Vector3(-fw.z, 0, fw.x);
  camera.position.addScaledVector(fw, f * speed * dt).addScaledVector(right, s * speed * dt);
  camera.position.y += u * 3 * dt;
  aim();
  return true;
}

renderer.domElement.addEventListener('dblclick', e => pickAndFly(e.clientX, e.clientY));
let lastTap = 0, tapX = 0, tapY = 0, downAt = 0, moved = false;
renderer.domElement.addEventListener('pointerdown', e => { downAt = performance.now(); moved = false; tapX = e.clientX; tapY = e.clientY; });
renderer.domElement.addEventListener('pointermove', e => { if (Math.hypot(e.clientX - tapX, e.clientY - tapY) > 10) moved = true; });
renderer.domElement.addEventListener('pointerup', e => {
  if (e.pointerType !== 'touch' || moved || performance.now() - downAt > 300) return;
  const now = performance.now();
  if (now - lastTap < 320) { pickAndFly(e.clientX, e.clientY); lastTap = 0; } else lastTap = now;
});

const help = document.getElementById('help'), helpBtn = document.getElementById('helpBtn');
const CTRL = {
  orbit: IS_MOBILE
    ? [['Вращать', 'вести пальцем'], ['Сдвигать', 'два пальца'], ['Масштаб', 'щипок'], ['Подлететь к точке', 'двойной тап']]
    : [['Вращать', 'зажать ЛКМ и вести'], ['Сдвигать', 'зажать ПКМ и вести'], ['Масштаб', 'колесо мыши'], ['Подлететь к точке', 'двойной клик']],
  walk: IS_MOBILE
    ? [['Идти', 'джойстик слева'], ['Смотреть', 'вести пальцем'], ['Выше / ниже', 'держать ▲ ▼ справа'], ['Перейти в точку', 'двойной тап']]
    : [['Идти', 'W A S D'], ['Смотреть', 'зажать ЛКМ и вести'], ['Повернуться', '← →'], ['Быстрее', 'зажать Shift'],
       ['Вниз / вверх', 'Q / E'], ['Перейти в точку', 'двойной клик']]
};
function renderHelp() {
  const rows = CTRL[walk ? 'walk' : 'orbit'].map(([a, b]) => `<div><span>${a}</span><span>${b}</span></div>`).join('');
  help.innerHTML =
    `<h3>${walk ? 'Прогулка' : 'Обзор'} — управление</h3><div class="rows">${rows}</div>` +
    `<h3>Кнопки внизу</h3><div class="btns">` +
    `<div><b>Общий вид</b> <span>— показать всю модель целиком</span></div>` +
    (walk ? `<div><b>Обзор</b> <span>— выйти из прогулки и снова вращать модель</span></div>`
          : `<div><b>Прогулка</b> <span>— вид от первого лица, как будто ходишь внутри</span></div>`) +
    `<div><b>Срез по высоте</b> <span>— срезать модель сверху, чтобы заглянуть внутрь</span></div></div>`;
}
const showHint = renderHelp;   // called on mode switch
let helpOpen = true;
try { helpOpen = localStorage.getItem('viewerHelp') !== '0'; } catch (_) {}
function setHelp(open) {
  helpOpen = open; help.classList.toggle('hide', !open); helpBtn.classList.toggle('on', open);
  try { localStorage.setItem('viewerHelp', open ? '1' : '0'); } catch (_) {}
}
renderHelp(); setHelp(helpOpen);
helpBtn.addEventListener('click', () => setHelp(!helpOpen));
document.getElementById('fsBtn').addEventListener('click', async () => {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await document.documentElement.requestFullscreen();
  } catch (_) { /* refused by the frame */ }
});

function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.1, (now - lastNow) / 1000); lastNow = now;
  if (walk) {
    if (stepWalk(dt)) dirty = true;
  } else {
    if (flight) {
      const k = Math.min(1, (now - flight.t0) / flight.dur), e = ease(k);
      camera.position.lerpVectors(flight.p0, flight.p1, e);
      controls.target.lerpVectors(flight.q0, flight.q1, e);
      const c0 = Math.min(flight.c0, NO_CUT), c1 = Math.min(flight.c1, NO_CUT);
      setCut(c0 + (c1 - c0) * e);
      if (k >= 1) flight = null;
      dirty = true;
    }
    if (controls.update()) dirty = true;
  }
  if (dirty) { renderer.render(scene, camera); dirty = false; }
}
requestAnimationFrame(loop);

function shrinkTextures(root, max) {
  const seen = new Set();
  root.traverse(o => {
    if (!o.isMesh) return;
    for (const m of [].concat(o.material)) {
      for (const k of ['map', 'alphaMap', 'normalMap', 'roughnessMap', 'metalnessMap', 'emissiveMap', 'aoMap']) {
        const t = m[k]; if (!t || seen.has(t)) continue; seen.add(t);
        const img = t.image; if (!img || !img.width) continue;
        const k2 = max / Math.max(img.width, img.height); if (k2 >= 1) continue;
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width * k2)); c.height = Math.max(1, Math.round(img.height * k2));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        if (img.close) img.close();
        t.image = c; t.needsUpdate = true;
      }
    }
  });
}

const lbar = document.getElementById('lbar'), lstat = document.getElementById('lstat'), lerr = document.getElementById('lerr');
const total = PARTS.reduce((s, p) => s + p[1], 0);
const totalBytes = PARTS.reduce((s, p) => s + p[2], 0);
const mb = b => (b / 1048576).toFixed(1).replace('.', ',');
const B64 = new Uint8Array(256);
'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'.split('').forEach((c, i) => { B64[c.charCodeAt(0)] = i; });
function b64into(src, dst, o) {        // ASCII base64 bytes -> dst, no intermediate strings
  let n = src.length;
  while (n > 0 && (src[n - 1] === 61 || src[n - 1] === 10 || src[n - 1] === 13 || src[n - 1] === 32)) n--;
  const full = n - (n % 4); let i = 0, j = o;
  for (; i < full; i += 4) {
    const a = B64[src[i]], b = B64[src[i + 1]], c = B64[src[i + 2]], d = B64[src[i + 3]];
    dst[j++] = (a << 2) | (b >> 4); dst[j++] = ((b & 15) << 4) | (c >> 2); dst[j++] = ((c & 3) << 6) | d;
  }
  const r = n - full;
  if (r >= 2) { const a = B64[src[i]], b = B64[src[i + 1]]; dst[j++] = (a << 2) | (b >> 4);
    if (r === 3) { const c = B64[src[i + 2]]; dst[j++] = ((b & 15) << 4) | (c >> 2); } }
  return j - o;
}
async function fetchModel() {
  const out = new Uint8Array(totalBytes);
  const got = new Array(PARTS.length).fill(0);
  const tick = () => {
    const s = got.reduce((a, b) => a + b, 0);
    lbar.style.width = (s / total * 96).toFixed(1) + '%';
    lstat.textContent = `${mb(s * 0.75)} из ${mb(total * 0.75)} МБ`;
  };
  const starts = []; let acc = 0;
  for (const p of PARTS) { starts.push(acc); acc += p[2]; }
  const loadPart = async i => {
    const [url, len, bytes] = PARTS[i];
    const res = await fetch(url);
    if (!res.ok) throw new Error(`${url}: HTTP ${res.status}`);
    const src = new Uint8Array(len); let pos = 0;
    const reader = res.body.getReader();
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      if (pos + value.length > len) throw new Error(`${url}: неожиданный размер`);
      src.set(value, pos); pos += value.length; got[i] += value.length; tick();
    }
    if (b64into(src.subarray(0, pos), out, starts[i]) !== bytes) throw new Error(`${url}: повреждённая часть`);
  };
  let next = 0;                                   // at most 2 parts in flight
  const worker = async () => { while (next < PARTS.length) await loadPart(next++); };
  await Promise.all([worker(), worker()]);
  return out.buffer;
}

try {
  const buf = await fetchModel();
  lbar.style.width = '100%';
  lstat.textContent = 'Подготовка модели…';
  await new Promise(r => setTimeout(r, 30));
  const gltf = await new Promise((res, rej) => new GLTFLoader().parse(buf, '', res, rej));
  model = gltf.scene;
  shrinkTextures(model, MAX_TEX);
  const is8bit = v => Math.abs(v * 255 - Math.round(v * 255)) < 1e-3;
  model.traverse(o => {
    if (!o.isMesh) return;
    for (const m of [].concat(o.material)) {
      if (m.color && !m.userData.srgbFixed && is8bit(m.color.r) && is8bit(m.color.g) && is8bit(m.color.b)) {
        m.color.convertSRGBToLinear(); m.userData.srgbFixed = true;   // SketchUp colors are sRGB 0..255 values
      }
      if (m.transparent) {
        m.depthWrite = false;
        if (/glass|стекл|translucent|curtain|sky/i.test(m.name || '')) m.opacity = Math.min(m.opacity, 0.3);
      }
    }
  });
  scene.add(model);
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3()), ctr = box.getCenter(new THREE.Vector3());
  groundY = box.min.y; NO_CUT = box.max.y + 0.01;
  cutRange.min = (box.min.y + 0.05).toFixed(2); cutRange.max = NO_CUT.toFixed(2);
  const r = size.length() * 0.5;
  const dist = r / Math.sin(THREE.MathUtils.degToRad(camera.fov) / 2) * 0.9;
  const dir = new THREE.Vector3(1, 0.65, 1).normalize();
  home = { pos: ctr.clone().addScaledVector(dir, dist).toArray(), tgt: [ctr.x, box.min.y + size.y * 0.25, ctr.z] };
  camera.position.fromArray(home.pos); controls.target.fromArray(home.tgt);
  camera.near = Math.max(0.05, r / 2000); camera.far = r * 20; camera.updateProjectionMatrix();
  controls.maxDistance = r * 6; controls.update();
  setCut(NO_CUT);
  requestRender();
  document.getElementById('loader').classList.add('done');
} catch (err) {
  console.error(err);
  lerr.style.display = 'block';
  lerr.textContent = 'Не удалось загрузить модель: ' + (err && err.message ? err.message : err) + '. Обновите страницу или проверьте интернет.';
}
</script>
